spring:
  application:
    name: todo-app
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:not-configured}
            client-secret: ${GOOGLE_CLIENT_SECRET:not-configured}
            scope:
              - openid
              - profile
              - email

app:
  security:
    jwt:
      secret: ${JWT_SECRET}
      access-token-ttl: 15m
      refresh-token-ttl: 7d
  oauth2:
    redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:3000/oauth2/callback}
  mail:
    from: ${MAIL_FROM:no-reply@example.com}
    resend-api-key: ${RESEND_API_KEY:}
  invitations:
    ttl: 48h
    accept-url: ${INVITATION_ACCEPT_URL:http://localhost:3000/invitations/accept}
    reject-url: ${INVITATION_REJECT_URL:http://localhost:3000/invitations/reject}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
